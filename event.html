<!DOCTYPE html>
<html>
<head>
    <title>Credit Card User Event</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #74ebd5, #9face6);
            padding: 50px;
        }

        .event {
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            width: 500px;
            margin: auto;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            color: #4a36c8;
        }

        button {
            padding: 10px 20px;
            background-color: #4a36c8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #30229b;
        }

        #form {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px gray;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 250px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        .close {
            background-color: red;
        }
    </style>
</head>

<body>

    <div class="event">
        <h1>Credit Card User Event</h1>

        <p>Join our event and learn about exciting credit card offers!</p>

        <p><b>Date:</b> 20 August 2026</p>
        <p><b>Venue:</b> College Auditorium</p>

        <button onclick="openRegistration()">
            Register Now
        </button>
    </div>


    <!-- Registration Popup -->
    <div id="form">

        <h2>+Registration Form</h2>

        <input type="text" id="name" placeholder="Enter Name">
        <br>

        <input type="email" id="email" placeholder="Enter Email">
        <br>

        <input type="text" id="card" placeholder="Enter Card Number">
        <br>

        <button onclick="submitRegistration()">
            Submit Registration
        </button>

        <button class="close" onclick="closeRegistration()">
            Close
        </button>

    </div>


    <script>

        function openRegistration() {
            document.getElementById("form").style.display = "block";
        }

        function closeRegistration() {
            document.getElementById("form").style.display = "none";
        }

        function submitRegistration() {

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let card = document.getElementById("card").value;

            // Check empty fields
            if (name == "" || email == "" || card == "") {
                alert("Please fill all the fields.");
                return;
            }

            // Confirmation popup
            let answer = confirm("Do you want to confirm your registration?");

            if (answer == true) {
                alert("Registration successful!");
                closeRegistration();
            }
            else {
                alert("Registration cancelled.");
            }
        }

    </script>

</body>
</html>
