<!DOCTYPE html>
<html>
<head>
<title>F1 registration</title>
<style>
body{
text-align: center;
font-family: Arial;
background-color:lightgray;
}
h1{
color:red;
}
input,select{
padding: 8px;
margin : 5px;
}
button{
background-color:red;
color:white;
padding:10px;
}
</style>
</head>
<body>
<h1>F1 car race registration</h1>
<form id="form">
<input type="text" id="name" placeholder="Enter the name:"><br>
<input type="email" id="email" placeholder="Enter the email:"><br>
<input type="number" id="age" placeholder="Enter the age:"><br>
Gender:
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female
<input type="radio" name="gender" value="other">other
<br><br>
<select id="team">
<option value=""></option>
<option>Ferrari</option>
<option>McLaren</option>
<option>Redbull</option>
</select>
<br><br>
<button type="submit">Register</button>
<h3 id="msg"</h3>
<script>
document.getElementById("form").onsubmit=function(e){
e.preventDefault();
let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let age=document.getElementById("age").value;
let gender=document.querySelector('input[name=gender]:checked')
let team=document.getElementById("team").value;
let msg=document.getElementById("msg")
if (name.length < 3) msg.innerHTML = "Enter a valid name!"; else if (email == "") msg.innerHTML = "Enter email!"; else if (age < 12 || age > 100 || age == "") msg.innerHTML = "Enter valid age!"; else if (!gender) msg.innerHTML = "Select gender!"; else if (team == "") msg.innerHTML = "Select a team!"; else { msg.innerHTML = "Registration Successful!"; msg.style.color = "green"; } }; </script> </body> </html>
